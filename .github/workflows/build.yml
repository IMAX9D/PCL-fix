name: Build
on:
  push:
    paths:
      - 'Plain Craft Launcher 2/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'Plain Craft Launcher 2/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: windows-latest
    strategy:  
       matrix:  
         configuration: [Debug, Release]

    steps:

    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 1
        submodules: true

    - name: Set Describe
      shell: bash
      run: |
          describe=`git describe --tags --always`
          echo "describe=$describe" >> $GITHUB_ENV

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v3
      with:
        msbuild-architecture: x64
    
    - name: Update Help
      run:  |
        Set-Location ..
        git clone https://github.com/LTCatt/PCL2Help.git -b master --single-branch --depth 1
        Set-Location PCL2Help
        Remove-Item -Path *.* -Recurse -Force
        Compress-Archive -Path .\* -DestinationPath .\Help.zip
        Copy-Item -Path .\Help.zip -Destination "${{ GITHUB.WORKSPACE }}\Plain Craft Launcher 2\Resources\Help.zip" -Force
        Set-Location ..
        Remove-Item PCL2Help -Recurse -Force
        Set-Location ${{ GITHUB.WORKSPACE }}


    - name: Replace
      env:
        PCL_BUILD_MS_CLIENT_ID: ${{ secrets.CLIENT_ID }}
        PCL_BUILD_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        PCL_BUILD_COMMIT: ${{ github.sha }}
      run: |
        $path = "Plain Craft Launcher 2\Modules\ModSecret.vb"
        $source = [IO.File]::ReadAllText($path)
        if (-not [string]::IsNullOrWhiteSpace($env:PCL_BUILD_MS_CLIENT_ID)) {
          if ($env:PCL_BUILD_MS_CLIENT_ID -notmatch '^(?:[0-9a-fA-F]{16}|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$') {
            throw "CLIENT_ID must be a public OAuth application identifier"
          }
          $source = [regex]::Replace($source, 'Public Const DefaultOAuthClientId As String = "[^"]*"', ('Public Const DefaultOAuthClientId As String = "' + $env:PCL_BUILD_MS_CLIENT_ID + '"'))
        }
        if (-not [string]::IsNullOrWhiteSpace($env:PCL_BUILD_CURSEFORGE_API_KEY)) {
          $key = $env:PCL_BUILD_CURSEFORGE_API_KEY.Replace('"', '""')
          $source = $source.Replace('If(Environment.GetEnvironmentVariable("PCL_CURSEFORGE_API_KEY"), "")', ('If(Environment.GetEnvironmentVariable("PCL_CURSEFORGE_API_KEY"), "' + $key + '")'))
        }
        [IO.File]::WriteAllText($path, $source)
        $path = "Plain Craft Launcher 2\Modules\Base\ModBase.vb"
        $source = [IO.File]::ReadAllText($path).Replace('Public Const CommitHash As String = ""', ('Public Const CommitHash As String = "' + $env:PCL_BUILD_COMMIT + '"'))
        [IO.File]::WriteAllText($path, $source)
        
    - name: Restore NuGet Packages
      run: dotnet restore PCLCS\PCLCS.csproj

    - name: Build
      run: msbuild "Plain Craft Launcher 2\Plain Craft Launcher 2.vbproj" -p:Configuration=${{ matrix.configuration }}

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.configuration }} ${{ env.describe }}
        path: Plain Craft Launcher 2\obj\${{ matrix.configuration }}\Plain Craft Launcher 2.exe
